<!DOCTYPE html>
<html>
<head>
  <title>Keep PC Awake</title>
</head>
<body>
  <h1>Keep Awake Demo</h1>
  <button id="wakeBtn">Activate Wake Lock</button>
  <button id="releaseBtn">Release Wake Lock</button>
  <p id="status">Status: idle</p>

  <script>
    let wakeLock = null;

    async function requestWakeLock() {
      if ("wakeLock" in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request("screen");
          document.getElementById("status").textContent = "Status: Wake Lock active";
          wakeLock.addEventListener("release", () => {
            document.getElementById("status").textContent = "Status: Wake Lock released";
          });
        } catch (err) {
          document.getElementById("status").textContent = `Error: ${err.message}`;
        }
      } else {
        // Fallback: keep system awake by playing a tiny hidden video
        const video = document.createElement("video");
        video.src = "data:video/mp4;base64,AAAA..."; // very short silent video
        video.loop = true;
        video.muted = true;
        video.play();
        document.body.appendChild(video);
        document.getElementById("status").textContent = "Status: Fallback video playing";
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
      document.getElementById("status").textContent = "Status: idle";
    }

    document.getElementById("wakeBtn").addEventListener("click", requestWakeLock);
    document.getElementById("releaseBtn").addEventListener("click", releaseWakeLock);
  </script>
</body>
</html>
